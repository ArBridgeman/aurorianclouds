version: 2

updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/banking-helpers"
      - "/jellyfin-helpers"
      - "/sous-chef"
      - "/utilities"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"

    cooldown:
      default-days: 7

    open-pull-requests-limit: 1

    groups:
      all-python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
