name: merge to main
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  call-utilities:
    uses: $/.github/workflows/test_utilities.yml
    permissions:
      contents: read
    secrets:
      GSHEETS_SERVICE_TOKEN: ${{ secrets.GSHEETS_SERVICE_TOKEN }}
      TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
      SONAR_TOKEN_UTILITIES: ${{ secrets.SONAR_TOKEN_UTILITIES }}
  call-jellyfin-helpers:
    uses: $/.github/workflows/test_jellyfin_helpers.yml
    permissions:
      contents: read
    secrets:
      GSHEETS_SERVICE_TOKEN: ${{ secrets.GSHEETS_SERVICE_TOKEN }}
      TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
      SONAR_TOKEN_JELLYFIN_HELPERS: ${{ secrets.SONAR_TOKEN_JELLYFIN_HELPERS }}
  call-sous-chef-tests:
    uses: $/.github/workflows/test_sous_chef.yml
    permissions:
      contents: read
    secrets:
      GSHEETS_SERVICE_TOKEN: ${{ secrets.GSHEETS_SERVICE_TOKEN }}
      TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
      SONAR_TOKEN_SOUS_CHEF: ${{ secrets.SONAR_TOKEN_SOUS_CHEF }}
  call-banking-helpers-tests:
    uses: $/.github/workflows/test_banking_helpers.yml
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN_BANKING_HELPERS: ${{ secrets.SONAR_TOKEN_BANKING_HELPERS }}
