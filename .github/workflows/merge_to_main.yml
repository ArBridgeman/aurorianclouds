name: merge to main
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  call-utilities:
    uses: ./.github/workflows/test_utilities.yml
    permissions:
      contents: read
    secrets:
      GSHEETS_SERVICE_TOKEN: ${{ secrets.GSHEETS_SERVICE_TOKEN }}
      TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  call-jellyfin-helpers:
    uses: ./.github/workflows/test_jellyfin_helpers.yml
    permissions:
      contents: read
    secrets:
      GSHEETS_SERVICE_TOKEN: ${{ secrets.GSHEETS_SERVICE_TOKEN }}
      TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  call-sous-chef-tests:
    uses: ./.github/workflows/test_sous_chef.yml
    permissions:
      contents: read
    secrets:
      GSHEETS_SERVICE_TOKEN: ${{ secrets.GSHEETS_SERVICE_TOKEN }}
      TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
      SONAR_TOKEN_SOUS_CHEF: ${{ secrets.SONAR_TOKEN_SOUS_CHEF }}
  call-banking-helpers-tests:
    uses: ./.github/workflows/test_banking_helpers.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  send_code_coverage:
    runs-on: ubuntu-24.04
    needs: [call-utilities, call-jellyfin-helpers, call-sous-chef-tests, call-banking-helpers-tests]
    permissions:
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
      - name: Display structure of downloaded files
        run: ls -R
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cov_sous_chef/sous_chef_unit_tests.xml,./cov_sous_chef/sous_chef_integration_tests.xml,./cov_jellyfin_helpers/jellyfin_helpers_unit_tests.xml,./cov_jellyfin_helpers/jellyfin_helpers_integration_tests.xml,./cov_utilities/utilities_tests.xml,./cov_banking_helpers/banking_helpers_unit_tests.xml,./cov_banking_helpers/banking_helpers_integration_tests.xml
          fail_ci_if_error: true
          verbose: false
