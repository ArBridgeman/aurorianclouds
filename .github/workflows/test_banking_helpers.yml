name: banking-helpers tests
on:
  push:
    paths:
      - banking-helpers/**
      - .github/workflows/test_banking_helpers.yml
    branches-ignore:
      - main
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

concurrency:
  group: ${{ github.ref }}-banking-helpers
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out our repo branch
        uses: actions/checkout@v6
      - name: Setup Python environment
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.3.2"
      - name: Install dependencies
        working-directory: ./banking-helpers
        run: poetry install
      - name: Run unit tests
        working-directory: ./banking-helpers
        run: poetry run pytest --cov=banking_helpers --cov-report=xml:banking_helpers_unit_tests.xml ./tests/unit
      - name: Run integration tests
        working-directory: ./banking-helpers
        run: poetry run pytest --cov=banking_helpers --cov-report=xml:banking_helpers_integration_tests.xml ./tests/integration
      - name: Upload coverage to Codecov
        if: github.ref != 'refs/heads/main'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./banking-helpers/banking_helpers_unit_tests.xml,./banking-helpers/banking_helpers_integration_tests.xml
          fail_ci_if_error: true
          verbose: false
      - name: Archive code coverage results
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: cov_banking_helpers
          path: ./banking-helpers/*.xml
          retention-days: 5
