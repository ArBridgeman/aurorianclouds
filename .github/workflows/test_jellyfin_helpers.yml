name: jellyfin-helper tests
on:
  workflow_call:
    secrets:
      GSHEETS_SERVICE_TOKEN:
        required: true
      TODOIST_TOKEN:
        required: true
      SONAR_TOKEN_JELLYFIN_HELPERS:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-jellyfin
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check out our repo branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check if relevant files were changed
        id: filter
        uses: ./.github/actions/check-file-changes
        with:
          paths: |
            jellyfin-helpers/
            utilities/utilities/
            .github/workflows/test_jellyfin_helpers.yml
  pytest:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out our repo branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python environment
        uses: ./.github/actions/poetry-setup-with-tokens
        with:
          poetry-dir: jellyfin-helpers
          poetry-lock-path: jellyfin-helpers/poetry.lock
          gsheets-service-token: ${{ secrets.GSHEETS_SERVICE_TOKEN }}
          todoist-token: ${{ secrets.TODOIST_TOKEN }}
      - name: Run unit tests
        working-directory: ./jellyfin-helpers
        run: poetry run pytest --cov=jellyfin_helpers --cov-report=xml:jellyfin_helpers_unit_tests.xml ./tests/unit_tests
      - name: Run integration tests
        working-directory: ./jellyfin-helpers
        run: poetry run pytest --cov=jellyfin_helpers --cov-report=xml:jellyfin_helpers_integration_tests.xml -k "not jellyfin" ./tests/integration_tests
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          projectBaseDir: ./jellyfin-helpers
          args: >-
            -Dsonar.projectKey=aurorianclouds.jellyfin-helpers
            -Dsonar.organization=aurorianclouds
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=jellyfin_helpers
            -Dsonar.tests=tests
            -Dsonar.python.version=3.11,3.12,3.13,3.14
            -Dsonar.python.coverage.reportPaths=jellyfin_helpers_unit_tests.xml,jellyfin_helpers_integration_tests.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_JELLYFIN_HELPERS }}
      - name: Archive code coverage results
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: cov_jellyfin_helpers
          path: ./jellyfin-helpers/*.xml
          retention-days: 5
