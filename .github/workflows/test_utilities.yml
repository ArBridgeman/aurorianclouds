name: utilities tests
on:
  workflow_call:
    secrets:
      GSHEETS_SERVICE_TOKEN:
        required: true
      TODOIST_TOKEN:
        required: true
      CODECOV_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-utilities
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check out our repo branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check if relevant files were changed
        id: filter
        uses: ./.github/actions/check-file-changes
        with:
          paths: |
            utilities/
            .github/workflows/test_utilities.yml
  pytest:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out our repo branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python environment
        uses: ./.github/actions/poetry-setup-with-tokens
        with:
          poetry-dir: utilities
          poetry-lock-path: utilities/poetry.lock
          gsheets-service-token: ${{ secrets.GSHEETS_SERVICE_TOKEN }}
          todoist-token: ${{ secrets.TODOIST_TOKEN }}
      - name: Run tests
        working-directory: ./utilities
        run: poetry run pytest --cov=utilities --cov-report=xml:utilities_tests.xml ./tests/
      - name: Upload coverage to Codecov
        if: github.ref != 'refs/heads/main'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./utilities/utilities_tests.xml
          fail_ci_if_error: true
          verbose: false
      - name: Archive code coverage results
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: cov_utilities
          path: ./utilities/*.xml
          retention-days: 5
