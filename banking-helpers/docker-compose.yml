version: '3.8'

services:
  banking-helper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banking-helper
    ports:
      - "8501:8501"
    restart: unless-stopped
    volumes:
      # Mount config directory for easy updates without rebuild
      - ./banking_helpers/config:/app/banking_helpers/config:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
