[tool.poetry]
name = "banking-helpers"
version = "0.1.0"
description = "Simple banking CSV cleaning tool"
authors = [
    "Aurorian Clouds <alex.transporter@gmail.com>"
]
readme = "README.md"  # Optional: add if you have one

[tool.poetry.dependencies]
python = ">=3.11"
pandas = ">=2.3.0,<3.0.0"
streamlit = ">=1.45.1,<2.0.0"
hydra-core = ">=1.3.2,<2.0.0"
omegaconf = ">=2.3.0,<3.0.0"
python-dateutil = ">=2.8.2,<3.0.0"
openpyxl = ">=3.1.0,<4.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
