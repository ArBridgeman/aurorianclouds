[project]
name = "project"
version = "1.0.0"
description = "Used for pre-commit"
authors = [{ name = "Aurorian Clouds" }]
requires-python = ">=3.10,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "autoflake>=2.3.3,<3",
    "black>=26.5.1,<27",
    "coverage>=7.15.4,<8",
    "flake8>=6.1.0,<7",
    "isort>=5.13.2,<6",
    "pre-commit>=2.12.1,<3",
    "yamllint>=1.38.0,<2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
