[project]
name = "sous_chef"
version = "1.2.3"
description = "Plans your meals and grocery list"
authors = [{ name = "Aurorian Clouds" }]
requires-python = ">=3.11,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[tool.poetry.dependencies]
fuzzywuzzy = ">=0.18,<0.19"
hydra-core = ">=1.2,<2"
pandas = ">=3.0.5,<4"
pandera = ">=0.32.1,<0.33"
pint = ">=0.25.3,<0.26"
pytesseract = ">=0.3.9,<0.4"
pytz = ">=2020.1"
python-Levenshtein = ">=0.27.4,<0.28"
regex = ">=2026.7.19,<2027"
structlog = ">=26.1.0,<27"
pydantic = ">=2.13.4,<3"
termcolor = ">=3.3.0,<4"
fastapi = ">=0.141.1,<1.0"
joblib = ">=1.3.2,<2"
numpy = ">=2.4.6,<3"
uvicorn = {extras = ["standard"], version = ">=0.52.3,<0.53"}
utilities = {path = "../utilities", develop = true}
setuptools = "==84.0.0"

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-cov>=4.1,<5",
    "pytest-structlog>=0.5,<0.6",
    "freezegun>=1.1,<2",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "dropbox: marks tests using dropbox",
    "gsheets: marks tests using gsheets",
    "todoist: marks tests using todoist, which requires periodically updating API key"
]
