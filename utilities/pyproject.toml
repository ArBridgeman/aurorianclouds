[project]
name = "utilities"
version = "0.1.0"
description = "Utilities used throughout Aurorian Clouds"
authors = [{ name = "Aurorian Clouds" }]
requires-python = ">=3.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "hydra-core>=1.3.5,<2",
    "joblib>=1.5.3,<2",
    "pandas>=3.0.5,<4",
    "pygsheets==2.0.5",
    "structlog>=26.1.0,<27",
    "tenacity>=9.1.4,<10",
    "todoist-api-python>=4.0.0,<5",
]

[dependency-groups]
dev = [
    "coverage>=7.15.4,<8",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-structlog>=1.2,<1.3",
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "gsheets: marks tests using gsheets",
    "todoist: marks tests using todoist, which requires periodically updating API key"
]
